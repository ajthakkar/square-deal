name: Refresh data and deploy

# The Franklin County Auditor posts new appraisal and tax extracts around the 15th of each month.
on:
  schedule:
    - cron: "0 12 17 * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q

      - name: Download the county's newest files
        run: python scripts/fetch.py
      - name: Build tables, validate, report, export
        run: |
          python -c "from squaredeal import pipeline; pipeline.prepare(refresh=True)"
          python scripts/validate.py
          python scripts/report.py
          python scripts/export_site.py

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm test
        working-directory: site
      - run: npm run build
        working-directory: site
        env:
          BASE_PATH: /square-deal
          NEXT_PUBLIC_GOATCOUNTER: ${{ vars.GOATCOUNTER }}
          NEXT_PUBLIC_FEEDBACK_URL: ${{ vars.FEEDBACK_URL }}

      - uses: actions/upload-artifact@v4
        with:
          name: results
          path: |
            results/*.json
            results/*.png
            data/raw/source.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
