[project]
name = "square-deal"
version = "0.1.0"
description = "Is your Franklin County home value in line with what similar homes sold for? A free check built on the county's public data."
requires-python = ">=3.11"
dependencies = ["pandas>=2.1", "numpy>=1.26", "pyarrow>=15", "scipy>=1.11", "pyshp>=2.3", "pyproj>=3.6", "matplotlib>=3.8", "requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
